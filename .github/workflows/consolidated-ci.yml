name: Consolidated CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  web-e2e:
    name: Web E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager openpyxl pandas
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
          if [ -f requirements-ci.txt ]; then pip install -r requirements-ci.txt; fi
      - run: |
          xvfb-run --auto-servernum python e2e_tests/test_implantai_300_e2e.py || echo "E2E tests failed"
          xvfb-run --auto-servernum python selenium_tests/implantai_full_suite.py || echo "Selenium suite failed"
        env:
          TEST_USERNAME: "clinicaldoc"
          TEST_PASSWORD: "ClinicalPass123!"
          HEADLESS: "true"
          PYTHONIOENCODING: "utf8"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e-reports
          path: |
            **/*.xlsx
            **/*.csv
            
  android-appium:
    name: Android Appium E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          cd appium_node_tests
          npm install
          npm test || echo "Appium tests failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-reports
          path: |
            **/*.xlsx
            **/*.csv

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas
          python generate_dast_suite.py || echo "Security scan failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            **/*.xlsx
            **/*.csv

  performance-load:
    name: Performance Load Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas
      - run: |
          cd load_tests
          npm install
          npm run test:load || echo "Load tests failed"
          node generate_test_cases_report.js || echo "JS report failed"
          python generate_final_report.py || echo "Python report failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports
          path: |
            **/*.xlsx
            **/*.csv

  unified-summary:
    name: Unified Summary & Report Deployment
    needs: [web-e2e, android-appium, backend-security, performance-load]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports
          merge-multiple: true
          
      - name: Generate Unified HTML Report
        run: |
          mkdir -p public
          echo "<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"UTF-8\"><title>Consolidated Test Reports</title>" > public/index.html
          echo "<style>body{font-family:sans-serif;margin:40px;background:#f5f5f5;} .card{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1);max-width:800px;margin:auto;} h1{color:#333;text-align:center;} ul{list-style:none;padding:0;} li{margin:10px 0;padding:10px;background:#e9ecef;border-radius:4px;} a{text-decoration:none;color:#007bff;font-weight:bold;} a:hover{text-decoration:underline;}</style>" >> public/index.html
          echo "</head><body><div class=\"card\"><h1>Unified Test Reports</h1><ul>" >> public/index.html
          
          # Iterate and copy all downloaded artifacts
          if [ -d "all-reports" ]; then
            find all-reports -type f | while read file; do
              filename=$(basename "$file")
              cp "$file" "public/$filename"
              echo "<li><a href=\"$filename\" download>$filename</a></li>" >> public/index.html
            done
          fi
          
          echo "</ul></div></body></html>" >> public/index.html

      - name: Upload HTML-Test-Reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Test-Reports
          path: public/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
