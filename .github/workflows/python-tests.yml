name: Python Tests CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium webdriver-manager openpyxl pandas
        if [ -f requirements-ci.txt ]; then pip install -r requirements-ci.txt; fi
        if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

    - name: Run Appium Node Tests
      run: |
        cd appium_node_tests
        npm install
        npm test || echo "Appium tests failed"
      continue-on-error: true

    - name: Run Load Tests
      run: |
        cd load_tests
        npm install
        npm run test:load || echo "Load tests failed"
      continue-on-error: true
        
    - name: Run E2E Tests
      env:
        TEST_USERNAME: "clinicaldoc"
        TEST_PASSWORD: "ClinicalPass123!"
        HEADLESS: "true"
      run: |
        python e2e_tests/test_implantai_300_e2e.py || echo "test_implantai_300_e2e.py failed"
        python e2e_tests/test_ai_analysis.py || echo "test_ai_analysis.py failed"
      continue-on-error: true
        
    - name: Run Selenium Full Suite
      env:
        TEST_USERNAME: "clinicaldoc"
        TEST_PASSWORD: "ClinicalPass123!"
        HEADLESS: "true"
      run: |
        python selenium_tests/implantai_full_suite.py || echo "Selenium suite failed"
      continue-on-error: true

    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: all-test-reports
        path: |
          **/*.xlsx
          **/*.csv
        retention-days: 30
